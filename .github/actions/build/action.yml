name: Build
description: Assemble the release APK and upload it as a workflow artifact.

inputs:
  artifact-name:
    description: Name to give the uploaded APK artifact.
    required: false
    default: release-apk

outputs:
  apk-path:
    description: Path to the assembled APK within the workspace.
    value: ${{ steps.locate.outputs.apk }}

runs:
  using: composite
  steps:
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Make gradlew executable
      shell: bash
      run: chmod +x ./gradlew

    - name: Assemble release APK
      shell: bash
      run: ./gradlew assembleRelease --no-daemon --stacktrace

    - name: Locate APK
      id: locate
      shell: bash
      run: |
        APK=$(find app/build/outputs/apk/release -name '*.apk' | head -n1)
        echo "apk=$APK" >> "$GITHUB_OUTPUT"
        echo "Built APK: $APK"

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ steps.locate.outputs.apk }}
        if-no-files-found: error
