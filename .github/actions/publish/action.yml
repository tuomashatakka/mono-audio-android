name: Publish Release
description: Download the APK artifact produced by the build action and publish a GitHub release (draft by default).

inputs:
  artifact-name:
    description: Name of the APK artifact to download (must match the build action).
    required: false
    default: release-apk
  github-token:
    description: Token used to create the release.
    required: true
  draft:
    description: >-
      Publish as a draft ("true") or a real, published release ("false").
      A published release is tagged v<versionName>; a draft is tagged
      v<versionName>-dev.<run_number> so successive draft builds never collide.
    required: false
    default: "true"
  prerelease:
    description: Mark the release as a pre-release.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Download APK artifact
      uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: artifact

    - name: Resolve release tag
      id: meta
      shell: bash
      run: |
        VERSION_NAME=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"(.*)".*/\1/')
        if [ "${{ inputs.draft }}" = "false" ]; then
          echo "tag=v${VERSION_NAME}" >> "$GITHUB_OUTPUT"
        else
          echo "tag=v${VERSION_NAME}-dev.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
        fi

    - name: Publish release
      uses: softprops/action-gh-release@v2
      with:
        token: ${{ inputs.github-token }}
        draft: ${{ inputs.draft }}
        prerelease: ${{ inputs.prerelease }}
        tag_name: ${{ steps.meta.outputs.tag }}
        target_commitish: ${{ github.sha }}
        name: MONO Signal ${{ steps.meta.outputs.tag }}
        generate_release_notes: true
        files: artifact/*.apk
