name: Publish Draft Release
description: Download the APK artifact produced by the build action and publish a draft GitHub release.

inputs:
  artifact-name:
    description: Name of the APK artifact to download (must match the build action).
    required: false
    default: release-apk
  github-token:
    description: Token used to create the release.
    required: true

runs:
  using: composite
  steps:
    - name: Download APK artifact
      uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: artifact

    - name: Resolve release tag
      id: meta
      shell: bash
      run: |
        VERSION_NAME=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"(.*)".*/\1/')
        echo "tag=v${VERSION_NAME}-dev.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

    - name: Publish draft release
      uses: softprops/action-gh-release@v2
      with:
        token: ${{ inputs.github-token }}
        draft: true
        tag_name: ${{ steps.meta.outputs.tag }}
        target_commitish: ${{ github.sha }}
        name: MONO Signal ${{ steps.meta.outputs.tag }}
        generate_release_notes: true
        files: artifact/*.apk
