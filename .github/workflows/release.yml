name: Release Draft

# Pushes to develop: build, then publish a draft release using the build artifact.
# Tests are intentionally NOT run here — they gate PRs and main via ci.yml.
on:
  push:
    branches: [ develop ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-draft
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build

  publish:
    name: Publish draft
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/publish
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
