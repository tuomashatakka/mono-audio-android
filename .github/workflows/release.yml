name: Release

# Pushes to develop: build, then publish a *draft* release using the build artifact.
# Manual runs (workflow_dispatch): build, then publish a *real, non-draft* release
# tagged v<versionName> — this is how a new version is cut. Dispatch it against the
# branch/tag that carries the versionName you want to release.
# Tests are intentionally NOT run here — they gate PRs and main via ci.yml.
on:
  push:
    branches: [ develop ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-draft
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build

  publish:
    name: Publish draft
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/publish
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # Manual dispatch publishes a real release; develop pushes stay drafts.
          draft: ${{ github.event_name == 'workflow_dispatch' && 'false' || 'true' }}
