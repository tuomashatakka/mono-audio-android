name: Release Draft

# Every push to `develop` builds a release APK and publishes it as a GitHub
# release *draft* (never auto-published — a human reviews and hits publish).
on:
  push:
    branches: [ develop ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-draft
  cancel-in-progress: false

jobs:
  release:
    name: Build & draft release
    runs-on: ubuntu-latest
    # Signing secrets are surfaced as env so step `if:` conditions can read them
    # (the `secrets` context is not available directly inside `if:`).
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Decode an optional release keystore from secrets. When absent, the build
      # falls back to debug signing (see app/build.gradle.kts) so the APK still installs.
      - name: Prepare signing keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Assemble release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Resolve version + APK path
        id: meta
        run: |
          VERSION_NAME=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"(.*)".*/\1/')
          echo "tag=v${VERSION_NAME}-dev.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -n1)
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "Resolved APK: $APK"

      - name: Publish draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: MONO Signal ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          files: ${{ steps.meta.outputs.apk }}
